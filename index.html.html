<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Pilotage opérationnel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
    defer
  ></script>

  <style>
    :root,
    [data-theme="light"] {
      --bg: #fff8fb;
      --surface: #ffffff;
      --surface-2: #fff0f6;
      --surface-3: #f8dce8;
      --surface-4: #f2c9db;

      --border: rgba(91, 43, 65, 0.15);
      --divider: rgba(91, 43, 65, 0.10);

      --text: #35242c;
      --muted: #745866;
      --faint: #987e8b;
      --inverse: #ffffff;

      --primary: #b53870;
      --primary-hover: #922956;
      --primary-active: #742044;
      --primary-soft: #f7d8e5;

      --success: #347553;
      --success-soft: #deefe6;

      --warning: #965b17;
      --warning-soft: #f7ead5;

      --danger: #aa3048;
      --danger-soft: #f8dce2;

      --blue: #326a98;
      --blue-soft: #dcebf7;

      --shadow-sm: 0 2px 10px rgba(91, 43, 65, 0.06);
      --shadow-md: 0 12px 34px rgba(91, 43, 65, 0.10);
      --shadow-lg: 0 26px 68px rgba(91, 43, 65, 0.18);
    }

    [data-theme="dark"] {
      --bg: #1d161a;
      --surface: #271e23;
      --surface-2: #302329;
      --surface-3: #3b2932;
      --surface-4: #4a313d;

      --border: rgba(255, 232, 242, 0.14);
      --divider: rgba(255, 232, 242, 0.09);

      --text: #f8eaf1;
      --muted: #c5a8b5;
      --faint: #987c89;
      --inverse: #2c1721;

      --primary: #e78eb5;
      --primary-hover: #f2a5c6;
      --primary-active: #fac2da;
      --primary-soft: #523044;

      --success: #80c09a;
      --success-soft: #263d31;

      --warning: #dfaa65;
      --warning-soft: #483621;

      --danger: #ed8799;
      --danger-soft: #4c2830;

      --blue: #89b7de;
      --blue-soft: #263847;

      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.18);
      --shadow-md: 0 12px 34px rgba(0, 0, 0, 0.28);
      --shadow-lg: 0 26px 68px rgba(0, 0, 0, 0.40);
    }

    :root {
      --font: "DM Sans", sans-serif;

      --text-xs: clamp(0.75rem, 0.72rem + 0.12vw, 0.84rem);
      --text-sm: clamp(0.875rem, 0.83rem + 0.18vw, 0.98rem);
      --text-base: clamp(1rem, 0.96rem + 0.18vw, 1.08rem);
      --text-lg: clamp(1.15rem, 1.04rem + 0.42vw, 1.4rem);
      --text-xl: clamp(1.55rem, 1.25rem + 1vw, 2.15rem);

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;

      --radius-sm: 0.4rem;
      --radius-md: 0.62rem;
      --radius-lg: 0.9rem;
      --radius-xl: 1.15rem;
      --radius-full: 999px;

      --sidebar-width: 286px;
      --topbar-height: 72px;
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: var(--font);
      font-size: var(--text-base);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea {
      color: inherit;
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button,
    input,
    select,
    textarea,
    a {
      transition:
        color var(--transition),
        background-color var(--transition),
        border-color var(--transition),
        box-shadow var(--transition),
        transform var(--transition);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
      outline: 3px solid color-mix(
        in srgb,
        var(--primary) 30%,
        transparent
      );
      outline-offset: 2px;
    }

    img,
    svg {
      display: block;
      max-width: 100%;
    }

    .hidden {
      display: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .skip-link {
      position: fixed;
      top: -100px;
      left: var(--space-4);
      z-index: 1000;
      padding: var(--space-3) var(--space-4);
      color: white;
      background: var(--primary);
      border-radius: var(--radius-md);
    }

    .skip-link:focus {
      top: var(--space-3);
    }

    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      grid-template-rows: var(--topbar-height) minmax(0, 1fr);
      height: 100dvh;
    }

    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: var(--space-5);
      min-width: 0;
      padding-inline: var(--space-5);
      background: color-mix(
        in srgb,
        var(--surface) 96%,
        transparent
      );
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(14px);
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-width: calc(var(--sidebar-width) - var(--space-5));
    }

    .logo {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: var(--radius-lg);
    }

    .logo svg {
      width: 28px;
      height: 28px;
    }

    .brand-title {
      display: block;
      font-size: var(--text-base);
      font-weight: 800;
      line-height: 1.15;
    }

    .brand-subtitle {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: var(--text-xs);
    }

    .global-search {
      position: relative;
      flex: 1;
      max-width: 680px;
    }

    .global-search input {
      width: 100%;
      height: 44px;
      padding:
        0
        48px
        0
        var(--space-4);
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .global-search input:focus {
      background: var(--surface);
      border-color: var(--primary);
      box-shadow: 0 0 0 4px color-mix(
        in srgb,
        var(--primary) 12%,
        transparent
      );
    }

    .search-icon {
      position: absolute;
      top: 50%;
      right: var(--space-4);
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-left: auto;
    }

    .save-indicator {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--muted);
      font-size: var(--text-xs);
      white-space: nowrap;
    }

    .save-indicator::before {
      width: 8px;
      height: 8px;
      content: "";
      background: var(--success);
      border-radius: 50%;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      min-height: 42px;
      padding: var(--space-2) var(--space-4);
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .button:hover {
      background: var(--surface-2);
      border-color: color-mix(
        in srgb,
        var(--primary) 38%,
        var(--border)
      );
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(0);
    }

    .button.primary {
      color: white;
      background: var(--primary);
      border-color: var(--primary);
    }

    .button.primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .button.success {
      color: white;
      background: var(--success);
      border-color: var(--success);
    }

    .button.danger {
      color: var(--danger);
      background: var(--danger-soft);
      border-color: transparent;
    }

    .button.ghost {
      background: transparent;
      border-color: transparent;
    }

    .button.small {
      min-height: 34px;
      padding: var(--space-1) var(--space-3);
      font-size: var(--text-xs);
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }

    .icon-button:hover {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .sidebar {
      min-height: 0;
      overflow-y: auto;
      padding: var(--space-5) var(--space-3);
      background: var(--surface);
      border-right: 1px solid var(--border);
      scrollbar-width: thin;
    }

    .nav-title {
      margin:
        var(--space-5)
        var(--space-3)
        var(--space-2);
      color: var(--faint);
      font-size: var(--text-xs);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav-title:first-child {
      margin-top: 0;
    }

    .nav-list {
      display: grid;
      gap: var(--space-1);
      list-style: none;
    }

    .nav-button {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 44px;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: 650;
      text-align: left;
    }

    .nav-button:hover {
      color: var(--text);
      background: var(--surface-2);
    }

    .nav-button.active {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .nav-icon {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      font-size: 17px;
    }

    .nav-count {
      min-width: 24px;
      margin-left: auto;
      padding: 2px 7px;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 800;
      text-align: center;
    }

    .company-card {
      margin-top: var(--space-6);
      padding: var(--space-4);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .company-card strong {
      display: block;
      margin-bottom: var(--space-1);
      font-size: var(--text-sm);
    }

    .company-card p {
      color: var(--muted);
      font-size: var(--text-xs);
    }

    .main-content {
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      padding: var(--space-6);
      scroll-behavior: smooth;
    }

    .page {
      width: 100%;
      max-width: 1680px;
      margin-inline: auto;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-6);
      margin-bottom: var(--space-6);
    }

    .page-title {
      margin-bottom: var(--space-2);
      font-size: var(--text-xl);
      line-height: 1.12;
      letter-spacing: -0.035em;
    }

    .page-description {
      max-width: 72ch;
      color: var(--muted);
      font-size: var(--text-sm);
    }

    .page-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: var(--space-2);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }

    .kpi-card {
      min-height: 128px;
      padding: var(--space-5);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }

    .kpi-label {
      color: var(--muted);
      font-size: var(--text-sm);
      font-weight: 700;
    }

    .kpi-value {
      margin: var(--space-3) 0 var(--space-1);
      font-size: clamp(1.8rem, 2.5vw, 2.6rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.045em;
    }

    .kpi-hint {
      color: var(--faint);
      font-size: var(--text-xs);
    }

    .kpi-card.danger .kpi-value {
      color: var(--danger);
    }

    .kpi-card.warning .kpi-value {
      color: var(--warning);
    }

    .kpi-card.success .kpi-value {
      color: var(--success);
    }

    .panel {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      min-height: 62px;
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--divider);
    }

    .panel-title {
      font-size: var(--text-lg);
      font-weight: 800;
    }

    .panel-body {
      padding: var(--space-5);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns:
        minmax(0, 1.35fr)
        minmax(320px, 0.65fr);
      gap: var(--space-5);
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
      padding: var(--space-3);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }

    .filter-bar input,
    .filter-bar select {
      min-height: 40px;
      padding: var(--space-2) var(--space-3);
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }

    .filter-bar input {
      min-width: 220px;
      flex: 1;
    }

    .tabs {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
      overflow-x: auto;
      padding-bottom: var(--space-1);
      scrollbar-width: thin;
    }

    .tab-button {
      min-height: 40px;
      padding: var(--space-2) var(--space-4);
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      font-weight: 700;
      white-space: nowrap;
    }

    .tab-button.active {
      color: var(--primary);
      background: var(--primary-soft);
      border-color: transparent;
    }

    .table-card {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }

    .table-scroll {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 960px;
      border-collapse: collapse;
    }

    th {
      padding: var(--space-3) var(--space-4);
      color: var(--muted);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      font-size: var(--text-xs);
      font-weight: 800;
      letter-spacing: 0.035em;
      text-align: left;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--divider);
      vertical-align: middle;
    }

    tbody tr:hover {
      background: color-mix(
        in srgb,
        var(--primary-soft) 50%,
        transparent
      );
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      padding: 3px 9px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: 750;
      white-space: nowrap;
    }

    .badge.primary {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .badge.success {
      color: var(--success);
      background: var(--success-soft);
    }

    .badge.warning {
      color: var(--warning);
      background: var(--warning-soft);
    }

    .badge.danger {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .badge.blue {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .row-actions {
      display: flex;
      gap: var(--space-1);
      white-space: nowrap;
    }

    .action-button {
      min-height: 34px;
      padding: var(--space-1) var(--space-2);
      color: var(--primary);
      background: transparent;
      border: 0;
      border-radius: var(--radius-sm);
      font-size: var(--text-xs);
      font-weight: 750;
    }

    .action-button:hover {
      background: var(--primary-soft);
    }

    .action-button.delete {
      color: var(--danger);
    }

    .action-button.delete:hover {
      background: var(--danger-soft);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-12) var(--space-6);
      color: var(--muted);
      text-align: center;
    }

    .empty-state strong {
      margin-bottom: var(--space-2);
      color: var(--text);
      font-size: var(--text-lg);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: var(--space-5);
      background: rgba(33, 18, 25, 0.62);
      backdrop-filter: blur(5px);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(980px, 100%);
      max-height: calc(100dvh - 40px);
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
    }

    .modal-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-5);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: var(--text-lg);
      font-weight: 800;
    }

    .modal-body {
      padding: var(--space-5);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      color: var(--muted);
      font-size: var(--text-sm);
      font-weight: 700;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 44px;
      padding: var(--space-2) var(--space-3);
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px color-mix(
        in srgb,
        var(--primary) 12%,
        transparent
      );
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: var(--space-2);
      margin-top: var(--space-6);
      padding-top: var(--space-4);
      border-top: 1px solid var(--divider);
    }

    .toast {
      position: fixed;
      right: var(--space-5);
      bottom: var(--space-5);
      z-index: 700;
      max-width: 390px;
      padding: var(--space-3) var(--space-4);
      color: white;
      background: #4b2939;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .mobile-menu,
    .floating-add {
      display: none;
    }

    @media (max-width: 1180px) {
      .kpi-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 860px) {
      body {
        overflow: auto;
      }

      .app-shell {
        display: block;
        height: auto;
      }

      .topbar {
        position: sticky;
        top: 0;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        min-height: 68px;
        padding: var(--space-2) var(--space-3);
      }

      .brand {
        min-width: 0;
      }

      .brand-subtitle,
      .global-search,
      .save-indicator,
      .desktop-only {
        display: none;
      }

      .mobile-menu {
        display: inline-grid;
      }

      .sidebar {
        position: fixed;
        inset: 68px auto 0 0;
        z-index: 200;
        width: min(310px, 88vw);
        transform: translateX(-105%);
        box-shadow: var(--shadow-lg);
        transition: transform 220ms ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main-content {
        min-height: calc(100dvh - 68px);
        overflow: visible;
        padding: var(--space-4) var(--space-3) 90px;
      }

      .page-header {
        display: block;
      }

      .page-actions {
        justify-content: flex-start;
        margin-top: var(--space-4);
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .floating-add {
        position: fixed;
        right: var(--space-4);
        bottom: calc(var(--space-4) + env(safe-area-inset-bottom));
        z-index: 100;
        display: inline-flex;
        min-width: 56px;
        min-height: 56px;
        padding: 0 var(--space-4);
        color: white;
        background: var(--primary);
        border: 0;
        border-radius: var(--radius-full);
        box-shadow: var(--shadow-lg);
        font-weight: 800;
      }
    }

    @media (max-width: 560px) {
      .kpi-grid {
        grid-template-columns: 1fr;
      }

      .filter-bar {
        display: grid;
        grid-template-columns: 1fr;
      }

      .filter-bar input,
      .filter-bar select {
        width: 100%;
        min-width: 0;
      }

      .modal-backdrop {
        padding: 0;
      }

      .modal {
        width: 100%;
        min-height: 100dvh;
        max-height: 100dvh;
        border-radius: 0;
      }
    }

    @media print {
      body {
        overflow: visible;
        color: #222;
        background: white;
      }

      .topbar,
      .sidebar,
      .page-actions,
      .filter-bar,
      .floating-add,
      .row-actions,
      .toast {
        display: none !important;
      }

      .app-shell {
        display: block;
        height: auto;
      }

      .main-content {
        overflow: visible;
        padding: 0;
      }
    }
  </style>
</head>

    function deepClone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function mergeState(input) {
      const base = deepClone(DEFAULT_STATE);
      const source = input && typeof input === "object" ? input : {};

      const result = {
        ...base,
        ...source,

        settings: {
          ...base.settings,
          ...(source.settings || {})
        },

        data: {
          ...base.data,
          ...(source.data || {})
        },

        customData: {
          ...base.customData,
          ...(source.customData || {})
        },

        meta: {
          ...base.meta,
          ...(source.meta || {})
        }
      };

      Object.keys(base.data).forEach((key) => {
        if (!Array.isArray(result.data[key])) {
          result.data[key] = [];
        }
      });

      if (!Array.isArray(result.customModules)) {
        result.customModules = [];
      }

      if (!Array.isArray(result.activity)) {
        result.activity = [];
      }

      if (!Array.isArray(result.trash)) {
        result.trash = [];
      }

      return result;
    }

    function createId() {
      if (
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
      ) {
        return window.crypto.randomUUID();
      }

      return (
        Date.now().toString(36) +
        Math.random().toString(36).slice(2)
      );
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeText(value) {
      return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function todayIso() {
      const date = new Date();
      const offset = date.getTimezoneOffset();
      const local = new Date(date.getTime() - offset * 60000);

      return local.toISOString().slice(0, 10);
    }

    function formatDate(value) {
      if (!value) {
        return "—";
      }

      const date = new Date(`${value}T12:00:00`);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return date.toLocaleDateString("fr-FR");
    }

    function formatDateTime(value) {
      if (!value) {
        return "—";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return date.toLocaleString("fr-FR");
    }

    function formatNumber(value, decimals = 2) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "—";
      }

      return number.toLocaleString("fr-FR", {
        minimumFractionDigits: 0,
        maximumFractionDigits: decimals
      });
    }

    function formatMoney(value, currency = "MAD") {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "—";
      }

      return `${number.toLocaleString("fr-FR", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })} ${currency || "MAD"}`;
    }

    function dateDifference(dateString) {
      if (!dateString) {
        return null;
      }

      const end = new Date(`${dateString}T23:59:59`);
      const now = new Date();

      return Math.ceil((end - now) / 86400000);
    }

    function isTaskClosed(task) {
      return ["Terminée", "Annulée"].includes(task.status);
    }

    function getCompanyName(code) {
      if (code === "SMMIM") {
        return state.settings.smmimName || "SMMIM";
      }

      if (code === "YDM") {
        return state.settings.ydmName || "YDM";
      }

      return code || "—";
    }

    function moduleDefinition(moduleName) {
      if (MODULES[moduleName]) {
        return MODULES[moduleName];
      }

      return state.customModules.find(
        (module) => module.id === moduleName
      );
    }

    function moduleItems(moduleName) {
      if (state.data[moduleName]) {
        return state.data[moduleName];
      }

      if (!state.customData[moduleName]) {
        state.customData[moduleName] = [];
      }

      return state.customData[moduleName];
    }

    function addActivity(action, moduleName, record) {
      const title =
        record.title ||

      state.activity.unshift({

      state.activity = state.activity.slice(0, 200);
    }

    function priorityRank(priority) {
      const ranks = {
        Critique: 5,
        Urgente: 4,
        Haute: 3,
        Normale: 2,
        Basse: 1
      };

      return ranks[priority] || 0;
    }

    function taskUrgencyScore(task) {
      let score = priorityRank(task.priority) * 20;
      const days = dateDifference(task.dueDate);

      if (days !== null && days < 0) {
        score += 200 + Math.abs(days);
      } else if (days === 0) {
        score += 150;
      } else if (days !== null && days <= 3) {
        score += 100 - days;
      }

      if (task.status === "Bloquée") {
        score += 80;
      }

      if (task.favorite) {
        score += 20;
      }

      return score;
    }

    function taskMatchesTab(task, tab) {
      const days = dateDifference(task.dueDate);
      const closed = isTaskClosed(task);
      const today = todayIso();

      if (tab === "urgent") {
        return (
          !closed &&
          (
            ["Critique", "Urgente"].includes(task.priority) ||
            (days !== null && days < 0) ||
            task.status === "Bloquée"
          )
        );
      }

      if (tab === "today") {
        return !closed && task.dueDate === today;
      }

      if (tab === "upcoming") {
        return (
          !closed &&
          days !== null &&
          days > 0 &&
          days <= 30
        );
      }

      if (tab === "personal") {
        return !closed && task.company === "Personnel";
      }

      if (tab === "delegated") {
        return (
          !closed &&
          Boolean(String(task.assignedTo || "").trim())
        );
      }

      if (tab === "waiting") {
        return (
          !closed &&
          (
            task.status === "En attente" ||
            Boolean(String(task.waitingFor || "").trim())
          )
        );
      }

      if (tab === "recurring") {
        return (
          !closed &&
          task.recurrence &&
          task.recurrence !== "Aucune"
        );
      }

      if (tab === "completed") {
        return task.status === "Terminée";
      }

      if (tab === "archived") {
        return Boolean(task.archived);
      }

      return true;
    }

    function getFilteredTasks() {
      const search = normalizeText(filters.search);

      return state.data.tasks
        .filter((task) => taskMatchesTab(task, currentTaskTab))
        .filter((task) => {
          if (
            filters.company !== "ALL" &&
            task.company !== filters.company
          ) {
            return false;
          }

          if (
            filters.status !== "ALL" &&
            task.status !== filters.status
          ) {
            return false;
          }

          if (!search) {
            return true;
          }

          return normalizeText(
            [
              task.title,
              task.description,
              task.project,
              task.category,
              task.owner,
              task.assignedTo,
              task.waitingFor,
              task.blocker,
              task.nextAction,
              task.notes
            ].join(" ")
          ).includes(search);
        })
        .sort((a, b) => {
          if (currentTaskTab === "urgent") {
            return taskUrgencyScore(b) - taskUrgencyScore(a);
          }

          const dateA = a.dueDate || "9999-12-31";
          const dateB = b.dueDate || "9999-12-31";

          return dateA.localeCompare(dateB);
        });
    }

    function getFilteredItems(moduleName) {
      if (moduleName === "tasks") {
        return getFilteredTasks();
      }

      const search = normalizeText(filters.search);

      return moduleItems(moduleName)
        .filter((record) => {
          if (
            filters.company !== "ALL" &&
            record.company !== filters.company &&
            record.linkedCompany !== filters.company
          ) {
            return false;
          }

          if (
            filters.status !== "ALL" &&
            record.status !== filters.status
          ) {
            return false;
          }

          if (
            filters.project !== "ALL" &&
            record.project !== filters.project &&
            record.shipmentRef !== filters.project
          ) {
            return false;
          }

          if (!search) {
            return true;
          }

          return normalizeText(
            JSON.stringify(record)
          ).includes(search);
        })
        .sort((a, b) => {
          const dateA =
            a.date ||
            a.dueDate ||
            a.deadline ||
            a.updatedAt ||
            "";

          const dateB =
            b.date ||
            b.dueDate ||
            b.deadline ||
            b.updatedAt ||
            "";

          return String(dateB).localeCompare(String(dateA));
        });
    }

    function logisticsMetrics(shipment) {
      const road = Number(shipment.roadInvoice || 0);
      const forwarder = Number(shipment.forwarderInvoice || 0);
      const laboratory = Number(
        shipment.laboratoryInvoice || 0
      );

      const total = road + forwarder + laboratory;
      const tonnage = Number(shipment.shippedTonnage || 0);

      return {
        road,
        forwarder,
        laboratory,
        total,
        perTonne: tonnage > 0 ? total / tonnage : 0
      };
    }

    function stockBalance(company = null) {
      return state.data.stock
        .filter((record) => {
          if (record.status === "Annulé") {
            return false;
          }

          if (company && record.company !== company) {
            return false;
          }

          return true;
        })
        .reduce((total, record) => {
          const quantity = Number(record.quantity || 0);

          if (
            record.movement === "Sortie" ||
            record.movement === "Ajustement négatif"
          ) {
            return total - quantity;
          }

          return total + quantity;
        }, 0);
    }

    function projectExpenseSummary(project = null) {
      const records = state.data.expenses.filter((record) => {
        return !project || record.project === project;
      });

      let received = 0;
      let spent = 0;
      let unjustified = 0;

      records.forEach((record) => {
        const amount = Number(record.amount || 0);

        if (record.movement === "Montant reçu") {
          received += amount;
        } else {
          spent += amount;

          if (!record.justified) {
            unjustified += amount;
          }
        }
      });

      return {
        received,
        spent,
        balance: received - spent,
        unjustified
      };
    }

    */    let database = null;

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = (event) => {
          const db = event.target.result;

          if (!db.objectStoreNames.contains("app")) {
            db.createObjectStore("app");
          }
        };

        request.onsuccess = () => {
          database = request.result;
          resolve(database);
        };

        request.onerror = () => {
          reject(request.error);
        };
      });
    }

    function databaseGet(key) {
      return new Promise((resolve, reject) => {
        if (!database) {
          resolve(null);
          return;
        }

        const transaction = database.transaction("app", "readonly");
        const store = transaction.objectStore("app");
        const request = store.get(key);

        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      });
    }

    function databasePut(key, value) {
      return new Promise((resolve, reject) => {
        if (!database) {
          reject(new Error("Base de données indisponible"));
          return;
        }

        const transaction = database.transaction("app", "readwrite");
        const store = transaction.objectStore("app");
        const request = store.put(value, key);

        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    async function loadApplicationState() {
      try {
        await openDatabase();
        const saved = await databaseGet(STATE_KEY);

        if (saved) {
          state = mergeState(saved);
        } else {
          state = mergeState(DEFAULT_STATE);
          await databasePut(STATE_KEY, state);
        }
      } catch (error) {
        console.error(error);
        state = mergeState(DEFAULT_STATE);
        showToast(
          "Le stockage local est indisponible. Utilise les sauvegardes JSON.",
          true
        );
      }
    }

    async function saveApplicationState(message = "Modifications enregistrées") {
      state.meta.updatedAt = new Date().toISOString();

      try {
        if (!database) {
          await openDatabase();
        }

        await databasePut(STATE_KEY, state);

        const indicator = document.getElementById("saveIndicator");

        if (indicator) {
          indicator.textContent =
            "Enregistré à " +
            new Date().toLocaleTimeString("fr-FR", {
              hour: "2-digit",
              minute: "2-digit"
            });
        }

        if (message) {
          showToast(message);
        }
      } catch (error) {
        console.error(error);
        showToast(
          "Échec de l’enregistrement. Télécharge une sauvegarde JSON.",
          true
        );
      }
    }

    function showToast(message, error = false) {
      const toast = document.getElementById("toast");

      if (!toast) {
        return;
      }

      toast.textContent = message;
      toast.style.background = error ? "#8f293d" : "#4b2939";
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }

    function derivedValue(moduleName, record, key) {
      if (key === "company") {
        return getCompanyName(record.company);
      }

      if (key === "attachments") {
        return attachmentCount(record);
      }

      if (moduleName === "road" && key === "route") {
        return [record.origin, record.destination]
          .filter(Boolean)
          .join(" → ") || "—";
      }

      if (moduleName === "road" && key === "netWeight") {
        const gross = Number(record.grossWeight || 0);
        const tare = Number(record.tareWeight || 0);

        if (!gross && !tare) {
          return "—";
        }

        return `${formatNumber(gross - tare, 3)} t`;
      }

      if (
        moduleName === "road" &&
        key === "roadCost"
      ) {
        return formatMoney(
          record.roadCost,
          record.currency || state.settings.currency
        );
      }

      if (
        moduleName === "stock" &&
        key === "quantity"
      ) {
        return record.quantity !== "" &&
          record.quantity !== undefined
          ? `${formatNumber(record.quantity, 3)} t`
          : "—";
      }

      if (moduleName === "expenses" && key === "amount") {
        return formatMoney(
          record.amount,
          record.currency || state.settings.currency
        );
      }

      if (moduleName === "expenses" && key === "justified") {
        return record.justified ? "Oui" : "Non";
      }

      if (moduleName === "shipments") {
        const metrics = logisticsMetrics(record);
        const currency =
          record.currency || state.settings.currency;

        if (key === "shippedTonnage") {
          return `${formatNumber(record.shippedTonnage, 3)} t`;
        }

        if (key === "roadInvoice") {
          return formatMoney(metrics.road, currency);
        }

        if (key === "forwarderInvoice") {
          return formatMoney(metrics.forwarder, currency);
        }

        if (key === "laboratoryInvoice") {
          return formatMoney(metrics.laboratory, currency);
        }

        if (key === "logisticsTotal") {
          return formatMoney(metrics.total, currency);
        }

        if (key === "costPerTonne") {
          return `${formatMoney(metrics.perTonne, currency)}/t`;
        }
      }

      if (moduleName === "tasks" && key === "progress") {
        return `${Math.max(
          0,
          Math.min(100, Number(record.progress || 0))
        )}%`;
      }

      const definition = moduleDefinition(moduleName);

      const field = definition?.fields?.find(
        (candidate) => candidate.name === key
      );

      if (field?.type === "date") {
        return formatDate(record[key]);
      }

      if (field?.type === "datetime-local") {
        return formatDateTime(record[key]);
      }

      return record[key] ?? "—";
    }

    function renderCell(moduleName, record, column, index) {
      const key = column.key;
      const raw = record[key];
      const value = derivedValue(moduleName, record, key);

      if (key === "status") {
        return statusBadge(raw);
      }

      if (key === "priority") {
        return priorityBadge(raw);
      }

      if (key === "company") {
        return `
          <span class="badge primary">
            ${escapeHtml(value)}
          </span>
        `;
      }

      if (
        moduleName === "expenses" &&
        key === "justified"
      ) {
        return record.justified
          ? `<span class="badge success">Oui</span>`
          : `<span class="badge danger">Non</span>`;
      }

      if (key === "attachments") {
        return attachmentCount(record)
          ? `<span class="badge blue">${attachmentCount(record)}</span>`
          : "0";
      }

      if (
        moduleName === "tasks" &&
        key === "progress"
      ) {
        const progress = Math.max(
          0,
          Math.min(100, Number(record.progress || 0))
        );

        return `
          <div style="display:flex;align-items:center;gap:8px">
            <div
              style="
                width:90px;
                height:8px;
                background:var(--surface-3);
                border-radius:999px;
                overflow:hidden;
              "
            >
              <div
                style="
                  width:${progress}%;
                  height:100%;
                  background:var(--primary);
                "
              ></div>
            </div>

            <small>${progress}%</small>
          </div>
        `;
      }

      const note =
        index === 0 &&
        record.notes
          ? `
            <small
              style="
                display:block;
                max-width:300px;
                overflow:hidden;
                margin-top:4px;
                color:var(--muted);
                font-size:var(--text-xs);
                text-overflow:ellipsis;
                white-space:nowrap;
              "
            >
              ${escapeHtml(record.notes)}
            </small>
          `
          : "";

      return `
        ${escapeHtml(value)}
        ${note}
      `;
    }

        );

      } else if (currentView === "expenses") {
        app.innerHTML = renderExpensesPage();
      } else if (currentView === "shipments") {
        app.innerHTML = renderShipmentsPage();
      } else if (currentView === "settings") {

    function defaultFieldValue(moduleName, field) {
      if (field.default !== undefined) {
        return field.default;
      }

      if (field.name === "date") {
        return todayIso();
      }

      if (field.name === "company") {
        return filters.company !== "ALL"
          ? filters.company
          : "SMMIM";
      }

      if (
        field.name === "origin" &&
        moduleName === "road"
      ) {
        return state.settings.mine;
      }

      if (
        field.name === "destination" &&
        moduleName === "road"
      ) {
        return state.settings.depot;
      }

      if (
        field.name === "origin" &&
        moduleName === "stock"
      ) {
        return state.settings.mine;
      }

      if (
        field.name === "location" &&
        moduleName === "stock"
      ) {
        return state.settings.depot;
      }

      if (
        field.name === "port" &&
        moduleName === "shipments"
      ) {
        return state.settings.port;
      }

      if (field.name === "currency") {
        return state.settings.currency;
      }

      return "";
    }

    function fieldControlHtml(moduleName, field, record) {
      const stored =
        record && record[field.name] !== undefined
          ? record[field.name]
          : defaultFieldValue(moduleName, field);

      const required = field.required ? "required" : "";
      const full = field.full ? "field full" : "field";
      const min = field.min !== undefined
        ? `min="${field.min}"`
        : "";
      const max = field.max !== undefined
        ? `max="${field.max}"`
        : "";
      const step = field.step !== undefined
        ? `step="${field.step}"`
        : "";

      if (field.type === "textarea") {
        return `
          <div class="${full}">
            <label for="field-${field.name}">
              ${escapeHtml(field.label)}
            </label>

            <textarea
              id="field-${field.name}"
              name="${field.name}"
              ${required}
            >${escapeHtml(stored)}</textarea>
          </div>
        `;
      }

      if (field.type === "select") {
        return `
          <div class="${full}">
            <label for="field-${field.name}">
              ${escapeHtml(field.label)}
            </label>

            <select
              id="field-${field.name}"
              name="${field.name}"
              ${required}
            >
              ${(field.options || [])
                .map(
                  (option) => `
                    <option
                      value="${escapeHtml(option)}"
                      ${
                        String(stored) === String(option)
                          ? "selected"
                          : ""
                      }
                    >
                      ${escapeHtml(option)}
                    </option>
                  `
                )
                .join("")}
            </select>
          </div>
        `;
      }

      if (field.type === "checkbox") {
        return `
          <div class="${full}">
            <label
              style="
                display:flex;
                align-items:center;
                gap:10px;
                min-height:44px;
              "
            >
              <input
                name="${field.name}"
                type="checkbox"
                value="true"
                ${stored ? "checked" : ""}
                style="
                  width:19px;
                  height:19px;
                  accent-color:var(--primary);
                "
              >

              ${escapeHtml(field.label)}
            </label>
          </div>
        `;
      }

      return `
        <div class="${full}">
          <label for="field-${field.name}">
            ${escapeHtml(field.label)}
          </label>

          <input
            id="field-${field.name}"
            name="${field.name}"
            type="${escapeHtml(field.type || "text")}"
            value="${escapeHtml(stored)}"
            ${required}
            ${min}
            ${max}
            ${step}
          >
        </div>
      `;
    }

    function openEditor(moduleName, recordId = null) {
      const definition = moduleDefinition(moduleName);

      if (!definition) {
        showToast("Module introuvable", true);
        return;
      }

      currentEditorModule = moduleName;
      currentEditorId = recordId;

      const record = recordId
        ? moduleItems(moduleName).find(
            (item) => item.id === recordId
          )
        : null;

      document.getElementById("editorTitle").textContent =
        recordId
          ? `Modifier ${definition.singular || "l’élément"}`
          : `Ajouter ${definition.singular || "un élément"}`;

      document.getElementById("editorFields").innerHTML =
        (definition.fields || [])
          .map((field) =>
            fieldControlHtml(moduleName, field, record)
          )
          .join("");

      document
        .getElementById("editorBackdrop")
        .classList.add("open");

      document.body.style.overflow = "hidden";

      setTimeout(() => {
        document.querySelector(
          "#editorFields input, #editorFields select, #editorFields textarea"
        )?.focus();
      }, 30);
    }

    function closeEditor() {
      document
        .getElementById("editorBackdrop")
        .classList.remove("open");

      document.body.style.overflow = "";
      currentEditorModule = null;
      currentEditorId = null;
    }

    async function submitEditor(event) {
      event.preventDefault();

      const definition = moduleDefinition(
        currentEditorModule
      );

      if (!definition) {
        return;
      }

      const formData = new FormData(event.currentTarget);
      const values = {};

      definition.fields.forEach((field) => {
        if (field.type === "checkbox") {
          values[field.name] =
            formData.get(field.name) === "true";
          return;
        }

        let value = formData.get(field.name);

        if (field.type === "number") {
          value =
            value === "" || value === null
              ? ""
              : Number(value);
        }

        values[field.name] = value;
      });

      const records = moduleItems(currentEditorModule);
      const now = new Date().toISOString();

      if (currentEditorId) {
        const index = records.findIndex(
          (record) => record.id === currentEditorId
        );

        if (index >= 0) {
          records[index] = {
            ...records[index],
            ...values,
            updatedAt: now
          };

          addActivity(
            "Modification",
            currentEditorModule,
            records[index]
          );
        }
      } else {
        const record = {
          id: createId(),
          ...values,
          attachments: [],
          history: [],
          createdAt: now,
          updatedAt: now
        };

        records.push(record);

        addActivity(
          "Création",
          currentEditorModule,
          record
        );
      }

      setModuleItems(currentEditorModule, records);

      closeEditor();
      await saveApplicationState("Enregistrement sauvegardé");
      renderApplication();
    }

    function generateNextRecurringTask(task) {
      if (
        !task.recurrence ||
        task.recurrence === "Aucune" ||
        !task.dueDate
      ) {
        return null;
      }

      const date = new Date(`${task.dueDate}T12:00:00`);

      if (task.recurrence === "Quotidienne") {
        date.setDate(date.getDate() + 1);
      }

      if (task.recurrence === "Hebdomadaire") {
        date.setDate(date.getDate() + 7);
      }

      if (task.recurrence === "Mensuelle") {
        date.setMonth(date.getMonth() + 1);
      }

      if (task.recurrence === "Trimestrielle") {
        date.setMonth(date.getMonth() + 3);
      }

      if (task.recurrence === "Annuelle") {
        date.setFullYear(date.getFullYear() + 1);
      }

      return {
        ...deepClone(task),
        id: createId(),
        status: "À faire",
        progress: 0,
        dueDate: date.toISOString().slice(0, 10),
        completedAt: "",
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        attachments: []
      };
    }

    async function completeTask(taskId) {
      const task = state.data.tasks.find(
        (record) => record.id === taskId
      );

      if (!task) {
        return;
      }

      task.status = "Terminée";
      task.progress = 100;
      task.completedAt = new Date().toISOString();
      task.updatedAt = new Date().toISOString();

      const nextTask = generateNextRecurringTask(task);

      if (nextTask) {
        state.data.tasks.push(nextTask);
        addActivity(
          "Occurrence récurrente créée",
          "tasks",
          nextTask
        );
      }

      addActivity("Tâche terminée", "tasks", task);

      await saveApplicationState("Tâche terminée");
      renderApplication();
    }

      const records = moduleItems(moduleName);
      const record = records.find(
        (item) => item.id === recordId
      );

      if (!record) {
        return;
      }

      const label =
        record.title ||

      if (

      const records = moduleItems(item.moduleName);

    function downloadBlob(content, filename, type) {
      const blob =
        content instanceof Blob
          ? content
          : new Blob([content], { type });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = filename;

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 1000);
    }

    function csvEscape(value) {
      return `"${String(value ?? "").replaceAll(
        '"',
        '""'
      )}"`;
    }

    function exportModuleCsv(moduleName) {
      const definition = moduleDefinition(moduleName);
      const records = getFilteredItems(moduleName);

      if (!definition || !records.length) {
        showToast("Aucune donnée à exporter", true);
        return;
      }

      const lines = [];

      lines.push(
        definition.fields
          .map((field) => csvEscape(field.label))
          .join(";")
      );

      records.forEach((record) => {
        lines.push(
          definition.fields
            .map((field) => {
              let value = record[field.name];

              if (field.type === "checkbox") {
                value = value ? "Oui" : "Non";
              }

              return csvEscape(value);
            })
            .join(";")
        );
      });

      downloadBlob(
        "\uFEFF" + lines.join("\n"),
        `${moduleName}-${todayIso()}.csv`,
        "text/csv;charset=utf-8"
      );

      showToast("Export CSV téléchargé");
    }

    function xmlEscape(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&apos;");
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);

        reader.readAsDataURL(file);
      });
    }

    async function addAttachments(files) {
      if (
        !attachmentTarget ||
        !files ||
        !files.length
      ) {
        return;
      }

      const records = moduleItems(
        attachmentTarget.moduleName
      );

      const record = records.find(
        (candidate) =>
          candidate.id === attachmentTarget.recordId
      );

      if (!record) {
        return;
      }

      if (!Array.isArray(record.attachments)) {
        record.attachments = [];
      }

      for (const file of files) {
        if (file.size > 8 * 1024 * 1024) {
          showToast(
            `${file.name} dépasse la limite de 8 Mo`,
            true
          );
          continue;
        }

        try {
          const data = await readFileAsDataUrl(file);

          record.attachments.push({
            id: createId(),
            name: file.name,
            type: file.type || "application/octet-stream",
            size: file.size,
            data,
            createdAt: new Date().toISOString()
          });
        } catch (error) {
          console.error(error);
          showToast(
            `Impossible d’ajouter ${file.name}`,
            true
          );
        }
      }

      record.updatedAt = new Date().toISOString();

      addActivity(
        "Ajout de pièces jointes",
        attachmentTarget.moduleName,
        record
      );

      await saveApplicationState(
        "Pièces jointes enregistrées"
      );

      renderApplication();
    }

        .replaceAll(" ", "")
        .replaceAll("_", "")
        .replaceAll("-", "");

    async function importTasksFile(file) {
      if (!file) {
        return;
      }

      if (!window.XLSX) {
        showToast(
          "La bibliothèque Excel n’est pas disponible",
          true
        );
        return;
      }

      try {
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer, {
          type: "array"
        });

        const sheet =
          workbook.Sheets[workbook.SheetNames[0]];

        const rows = XLSX.utils.sheet_to_json(
          sheet,
          {
            defval: ""
          }
        );

        if (!rows.length) {
          showToast("Le fichier ne contient aucune ligne", true);
          return;
        }

        const mapping = {
          titre: "title",
          tache: "title",
          description: "description",
          societe: "company",
          domaine: "company",
          projet: "project",
          categorie: "category",
          priorite: "priority",
          statut: "status",
          responsable: "owner",
          deleguea: "assignedTo",
          echeance: "dueDate",
          datedebut: "startDate",
          rappel: "reminder",
          avancement: "progress",
          recurrence: "recurrence",
          notes: "notes"
        };

        let imported = 0;

        rows.forEach((row) => {
          const task = {
            id: createId(),
            title: "",
            company: "SMMIM",
            priority: "Normale",
            status: "À faire",
            progress: 0,
            recurrence: "Aucune",
            attachments: [],
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          };

          Object.entries(row).forEach(
            ([header, value]) => {
              const normalized = normalizeHeader(header);
              const target = mapping[normalized];

              if (target) {
                task[target] = value;
              }
            }
          );

          if (task.title) {
            task.progress = Number(task.progress || 0);
            state.data.tasks.push(task);
            imported += 1;
          }
        });

        await saveApplicationState(
          `${imported} tâche(s) importée(s)`
        );

        renderApplication();
      } catch (error) {
        console.error(error);
        showToast(
          "Impossible de lire le fichier Excel/CSV",
          true
        );
      }
    }

    function parseCustomFields(text) {
      return String(text || "")
        .split("\n")
        .map((line) => line.trim())
        .filter(Boolean)
        .map((line, index) => {
          const [labelRaw, typeRaw, optionsRaw] =
            line.split("|");

          const label =
            labelRaw?.trim() || `Champ ${index + 1}`;

          const type =
            typeRaw?.trim().toLowerCase() || "text";

          const name =
            normalizeText(label)
              .replace(/[^a-z0-9]+/g, "_")
              .replace(/^_+|_+$/g, "") ||
            `champ_${index + 1}`;

          const field = {
            name,
            label,
            type,
            full: ["textarea"].includes(type)
          };

          if (type === "select") {
            field.options = String(optionsRaw || "")
              .split(",")
              .map((option) => option.trim())
              .filter(Boolean);
          }

          if (type === "number") {
            field.step = "0.01";
          }

          return field;
        });
    }

    async function createCustomModule(event) {
      event.preventDefault();

      const data = new FormData(event.currentTarget);
      const title = String(data.get("title") || "").trim();

      if (!title) {
        return;
      }

      let id =
        "custom_" +
        normalizeText(title)
          .replace(/[^a-z0-9]+/g, "_")
          .replace(/^_+|_+$/g, "");

      if (
        BUILTIN_VIEWS.includes(id) ||
        state.customModules.some(
          (module) => module.id === id
        )
      ) {
        id += "_" + Date.now().toString(36);
      }

      const fields = parseCustomFields(
        data.get("fields")
      );

      if (!fields.length) {
        showToast(
          "Ajoute au moins un champ au volet",
          true
        );
        return;
      }

      const firstField = fields[0];

      state.customModules.push({
        id,
        title,
        icon: String(data.get("icon") || "◇").trim(),
        description: String(
          data.get("description") || ""
        ).trim(),
        singular: "un élément",
        fields,
        columns: fields
          .slice(0, 7)
          .map((field) => ({
            key: field.name,
            label: field.label
          })),
        hidden: false
      });

      state.customData[id] = [];

      await saveApplicationState("Volet créé");
      event.currentTarget.reset();
      renderApplication();
    }

    async function editCustomFields(id) {
      const module = state.customModules.find(
        (candidate) => candidate.id === id
      );

      if (!module) {
        return;
      }

      const current = module.fields
        .map((field) => {
          const options =
            field.type === "select"
              ? `|${(field.options || []).join(",")}`
              : "";

          return `${field.label}|${field.type}${options}`;
        })
        .join("\n");

      const result = window.prompt(
        "Modifie les champs, une ligne par champ :",
        current
      );

      if (!result) {
        return;
      }

      const fields = parseCustomFields(result);

      if (!fields.length) {
        return;
      }

      module.fields = fields;
      module.columns = fields
        .slice(0, 7)
        .map((field) => ({
          key: field.name,
          label: field.label
        }));

      await saveApplicationState("Champs modifiés");
      renderApplication();
    }

    async function moveCustomModule(id, direction) {
      const index = state.customModules.findIndex(
        (module) => module.id === id
      );

      if (index < 0) {
        return;
      }

      const target = index + direction;

      if (
        target < 0 ||
        target >= state.customModules.length
      ) {
        return;
      }

      const temporary = state.customModules[index];

      state.customModules[index] =
        state.customModules[target];

      state.customModules[target] = temporary;

      await saveApplicationState("Ordre des volets modifié");
      renderApplication();
    }

    async function toggleCustomModule(id) {
      const module = state.customModules.find(
        (candidate) => candidate.id === id
      );

      if (!module) {
        return;
      }

      module.hidden = !module.hidden;

      await saveApplicationState(
        module.hidden
          ? "Volet masqué"
          : "Volet affiché"
      );

      renderApplication();
    }

    async function deleteCustomModule(id) {
      const module = state.customModules.find(
        (candidate) => candidate.id === id
      );

      if (!module) {
        return;
      }

      if (
        !window.confirm(
          `Supprimer le volet « ${module.title} » et ses données ?`
        )
      ) {
        return;
      }

      state.customModules =
        state.customModules.filter(
          (candidate) => candidate.id !== id
        );

      delete state.customData[id];

      if (currentView === id) {
        currentView = "dashboard";
      }

      await saveApplicationState("Volet supprimé");
      renderApplication();
    }

    async function saveSettings(event) {
      event.preventDefault();

      const data = new FormData(event.currentTarget);

      state.settings.appName =
        String(data.get("appName") || "").trim() ||
        "Pilotage opérationnel";

      state.settings.smmimName =
        String(data.get("smmimName") || "").trim() ||
        "SMMIM";

      state.settings.ydmName =
        String(data.get("ydmName") || "").trim() ||
        "YDM";

      state.settings.mine =
        String(data.get("mine") || "").trim();

      state.settings.depot =
        String(data.get("depot") || "").trim();

      state.settings.port =
        String(data.get("port") || "").trim();

      state.settings.currency =
        String(data.get("currency") || "MAD");

      await saveApplicationState("Paramètres enregistrés");
      renderApplication();
    }

    document.addEventListener("click", async (event) => {
      const button = event.target.closest("button");

      if (!button) {
        return;
      }

      if (button.dataset.view) {
        navigateTo(button.dataset.view);
        return;
      }

      if (button.dataset.viewTarget) {
        navigateTo(button.dataset.viewTarget);
        return;
      }

      if (button.dataset.add) {
        openEditor(button.dataset.add);
        return;
      }

      if (button.dataset.editModule) {
        openEditor(
          button.dataset.editModule,
          button.dataset.editId
        );
        return;
      }

      if (button.dataset.duplicateModule) {
        await duplicateRecord(
          button.dataset.duplicateModule,
          button.dataset.duplicateId
        );
        return;
      }

      if (button.dataset.deleteModule) {
        await deleteRecord(
          button.dataset.deleteModule,
          button.dataset.deleteId
        );
        return;
      }

      if (button.dataset.completeTask) {
        await completeTask(
          button.dataset.completeTask
        );
        return;
      }

      if (button.dataset.taskTab) {
        currentTaskTab = button.dataset.taskTab;
        renderApplication();
        return;
      }

      if (button.dataset.exportCsv) {
        exportModuleCsv(button.dataset.exportCsv);
        return;
      }

      if (button.dataset.exportExcel) {
        exportModuleExcel(
          button.dataset.exportExcel
        );
        return;
      }

      if (button.dataset.attachmentModule) {
        openAttachmentPicker(
          button.dataset.attachmentModule,
          button.dataset.attachmentId,
          false
        );
        return;
      }

      if (button.dataset.downloadAttachment) {
        downloadAttachment(
          button.dataset.attachmentModuleName,
          button.dataset.attachmentRecordId,
          button.dataset.downloadAttachment
        );
        return;
      }

      if (button.dataset.removeAttachment) {
        await removeAttachment(
          button.dataset.attachmentModuleName,
          button.dataset.attachmentRecordId,
          button.dataset.removeAttachment
        );
        return;
      }

      if (button.dataset.restoreTrash) {
        await restoreTrashItem(
          button.dataset.restoreTrash
        );
        return;
      }

      if (button.dataset.customUp) {
        await moveCustomModule(
          button.dataset.customUp,
          -1
        );
        return;
      }

      if (button.dataset.customDown) {
        await moveCustomModule(
          button.dataset.customDown,
          1
        );
        return;
      }

      if (button.dataset.customEdit) {
        await editCustomModule(
          button.dataset.customEdit
        );
        return;
      }

      if (button.dataset.customFields) {
        await editCustomFields(
          button.dataset.customFields
        );
        return;
      }

      if (button.dataset.customToggle) {
        await toggleCustomModule(
          button.dataset.customToggle
        );
        return;
      }

      if (button.dataset.customDelete) {
        await deleteCustomModule(
          button.dataset.customDelete
        );
        return;
      }

      if (button.hasAttribute("data-print")) {
        window.print();
        return;
      }

      if (button.id === "resetFiltersButton") {
        resetFilters();
        return;
      }

      if (button.id === "importTasksButton") {
        document.getElementById(
          "excelImportInput"
        ).click();
        return;
      }

      if (
        button.id === "exportXmindButton" ||
        button.id === "settingsXmindButton"
      ) {
        exportXmindMarkdown();
        return;
      }

      if (button.id === "exportOpmlButton") {
        exportOpml();
        return;
      }

      if (button.id === "manualSaveButton") {
        await saveApplicationState(
          "Toutes les données sont enregistrées"
        );
        return;
      }

      if (button.id === "exportJsonButton") {
        exportJson();
        return;
      }

      if (button.id === "importJsonButton") {
        document.getElementById(
          "jsonImportInput"
        ).click();
        return;
      }

      if (button.id === "exportAllExcelButton") {
        exportAllExcel();
      }
    });

    document.addEventListener("change", (event) => {
      if (event.target.id === "companyFilter") {
        filters.company = event.target.value;
        renderApplication();
      }

      if (event.target.id === "statusFilter") {
        filters.status = event.target.value;
        renderApplication();
      }

      if (event.target.id === "projectFilter") {
        filters.project = event.target.value;
        renderApplication();
      }
    });

    document.addEventListener("input", (event) => {
      if (event.target.id === "moduleSearch") {
        filters.search = event.target.value;

        const position =
          event.target.selectionStart || 0;

        renderApplication();

        requestAnimationFrame(() => {
          const input =
            document.getElementById("moduleSearch");

          if (input) {
            input.focus();
            input.setSelectionRange(
              position,
              position
            );
          }
        });
      }
    });

    document.addEventListener("submit", async (event) => {
      if (event.target.id === "settingsForm") {
        await saveSettings(event);
      }

      if (event.target.id === "customModuleForm") {
        await createCustomModule(event);
      }
    });

    document
      .getElementById("editorForm")
      .addEventListener("submit", submitEditor);

    document
      .getElementById("closeEditorButton")
      .addEventListener("click", closeEditor);

    document
      .getElementById("cancelEditorButton")
      .addEventListener("click", closeEditor);

    document
      .getElementById("editorBackdrop")
      .addEventListener("click", (event) => {
        if (event.target.id === "editorBackdrop") {
          closeEditor();
        }
      });

    document
      .getElementById("mobileMenuButton")
      .addEventListener("click", () => {
        document
          .getElementById("sidebar")
          .classList.toggle("open");
      });

    document
      .getElementById("themeButton")
      .addEventListener("click", async () => {
        state.settings.theme =
          state.settings.theme === "dark"
            ? "light"
            : "dark";

        await saveApplicationState("");
        renderApplication();
      });

    document
      .getElementById("quickAddButton")
      .addEventListener("click", () => {
        const target =
          moduleDefinition(currentView)
            ? currentView
            : "tasks";

        openEditor(target);
      });

    document
      .getElementById("floatingAddButton")
      .addEventListener("click", () => {
        const target =
          moduleDefinition(currentView)
            ? currentView
            : "tasks";

        openEditor(target);
      });

    document
      .getElementById("globalSearch")
      .addEventListener("input", (event) => {
        filters.search = event.target.value;

        if (
          currentView === "dashboard" ||
          currentView === "settings"
        ) {
          currentView = "tasks";
          window.location.hash = "tasks";
        }

        renderApplication();

        requestAnimationFrame(() => {
          const input =
            document.getElementById("globalSearch");

          if (input) {
            input.focus();

            input.setSelectionRange(
              filters.search.length,
              filters.search.length
            );
          }
        });
      });

    document
      .getElementById("attachmentInput")
      .addEventListener("change", async (event) => {
        await addAttachments(
          Array.from(event.target.files || [])
        );

        event.target.value = "";
      });

    document
      .getElementById("cameraInput")
      .addEventListener("change", async (event) => {
        await addAttachments(
          Array.from(event.target.files || [])
        );

        event.target.value = "";
      });

    document
      .getElementById("jsonImportInput")
      .addEventListener("change", async (event) => {
        await importJsonFile(
          event.target.files?.[0]
        );

        event.target.value = "";
      });

    document
      .getElementById("excelImportInput")
      .addEventListener("change", async (event) => {
        await importTasksFile(
          event.target.files?.[0]
        );

        event.target.value = "";
      });

    window.addEventListener("hashchange", () => {
      const view =
        window.location.hash.replace("#", "");

      if (view) {
        currentView = view;
        resetFilters(false);
        renderApplication();
      }
    });

    window.addEventListener("keydown", async (event) => {
      if (event.key === "Escape") {
        closeEditor();

        document
          .getElementById("sidebar")
          .classList.remove("open");
      }

      if (
        (event.ctrlKey || event.metaKey) &&
        event.key.toLowerCase() === "s"
      ) {
        event.preventDefault();

        await saveApplicationState(
          "Données enregistrées"
        );
      }

      if (
        (event.ctrlKey || event.metaKey) &&
        event.key === "Enter"
      ) {
        event.preventDefault();

        const target =
          moduleDefinition(currentView)
            ? currentView
            : "tasks";

        openEditor(target);
      }
    });

    async function initializeApplication() {
      await loadApplicationState();

      const hash =
        window.location.hash.replace("#", "");

      const customExists =
        state.customModules.some(
          (module) => module.id === hash
        );

      if (
        BUILTIN_VIEWS.includes(hash) ||
        customExists
      ) {
        currentView = hash;
      } else {
        currentView = "dashboard";
        window.location.hash = "dashboard";
      }

      renderApplication();
    }

    initializeApplication();
  </script>
</body>
</html>
